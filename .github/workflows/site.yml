name: Tests and website

# Runs the tests and builds the website on every push and pull request. On main,
# it also publishes the website to GitHub Pages. The build downloads three.js and
# OpenSCAD's WebAssembly build from the npm registry, pinned and hash-checked, and
# renders each printable part with Node.js.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pytest from Ubuntu's packages
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends python3-pytest
      - name: Tests
        run: python3 -m pytest -q
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: JavaScript tests
        run: node --test "tests/js/*.test.mjs"
      - name: Build the website, with its pinned libraries and the rendered parts
        run: PYTHONPATH=src python3 -m follow_me.website _site --vendor --render-parts
      - name: Upload the website
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
