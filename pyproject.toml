[project]
name = "follow-me-drone-agent"
version = "0.0.1"
description = "Hobby project: drone follow logic for filming a pennyboarder (simulation-first, no flight code yet)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
